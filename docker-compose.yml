
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: brightside_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brightside_db}
      POSTGRES_USER: ${POSTGRES_USER:-brightside_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brightside_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brightside_user} -d ${POSTGRES_DB:-brightside_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - brightside_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brightside_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./media:/app/media
    expose:
      - "8000"
    ports:
      - "8000:8000"
    networks:
      - brightside_network

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: brightside_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@brightside.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgres
    ports:
      - "5050:80"
    networks:
      - brightside_network

networks:
  brightside_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
